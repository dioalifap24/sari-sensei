 <script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Cari elemen nama pengguna — sesuaikan dengan yang ada di tampilan
  const namaPenggunaEl = document.querySelector('.nama-pengguna, [class*="nama"], button:has-text("skywalker")');
  const tombolMenu = document.querySelector('#tombol-menu, button:has(≡), button[aria-label*="menu"]');

  if (!tombolMenu) return;

  const namaPengguna = namaPenggunaEl?.textContent?.trim() || '';

  if (namaPengguna === 'skywalker') {
    tombolMenu.style.display = 'block';
  } else {
    tombolMenu.style.display = 'none';
  }
});
</script>
