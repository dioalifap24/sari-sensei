    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
 <script>
document.addEventListener('DOMContentLoaded', function() {
  try {
    const cekDanSembunyikan = setInterval(function() {
      try {
        const buttons = Array.from(document.querySelectorAll('button'));
        const elemenNama = buttons.find(b => b.textContent && (b.textContent.includes('kingugik') || b.textContent.includes('skywalker')));
        const tombolMenu = document.querySelector('button[aria-label="menu"], button.bg-black\\/80, .rounded-full button');

        if (elemenNama && tombolMenu) {
          clearInterval(cekDanSembunyikan);
          const namaSaatIni = (elemenNama.textContent || '').trim();
          if (namaSaatIni.includes('skywalker')) {
            tombolMenu.style.display = 'block';
          } else {
            tombolMenu.style.display = 'none';
            tombolMenu.style.visibility = 'hidden';
            tombolMenu.style.opacity = '0';
          }
        }
      } catch (err) {
        // silent
      }
    }, 200);
  } catch (e) {
    // silent
  }
});
</script>
 </body>
