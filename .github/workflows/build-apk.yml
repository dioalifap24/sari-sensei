name: Build APK Sari Sensei JLPT

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build File Android APK (Sari Sensei JLPT)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Setup Java JDK 17 (Untuk Gradle & Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install Dependencies Proyek
        run: npm install

      - name: 6. Setup Proyek Android Native & Ikon Sari Sensei (Capacitor)
        run: node scripts/apk/setup-capacitor.cjs

      - name: 7. Compile File Android APK (Gradle Assemble)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Siapkan File Output Sari-Sensei-JLPT.apk
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/Sari-Sensei-JLPT.apk
          ls -lh output_apk/Sari-Sensei-JLPT.apk

      - name: 9. Upload File APK ke GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sari-Sensei-JLPT-APK
          path: output_apk/Sari-Sensei-JLPT.apk
          if-no-files-found: error
          retention-days: 90

      - name: 10. Publikasikan File APK ke Menu GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "🌸 Sari Sensei JLPT Android APK & iOS App (Build #${{ github.run_number }})"
          body: |
            ## 📱 Panduan Instalasi Aplikasi Sari Sensei (Android & iPhone / iOS)
            
            ### 🤖 1. Pengguna Android (Install APK)
            Unduh file **`Sari-Sensei-JLPT.apk`** di bawah ini (pada bagian **Assets**) lalu pasang langsung di HP Android Murid maupun Master.
            
            ### 🍏 2. Pengguna iPhone / iOS (Install Web App / PWA)
            Karena keterbatasan iOS, pengguna iPhone/iPad dapat memasang aplikasi langsung melalui browser **Safari**:
            1. Buka URL aplikasi Sari Sensei di Safari.
            2. Ketuk tombol **Bagikan (Share)** lalu pilih **"Tambahkan ke Layar Utama" (Add to Home Screen)**.
            3. Sari Sensei akan terpasang di layar utama iPhone Anda layaknya aplikasi native App Store!
            
            ### ✨ Fitur Terbaru di Update Ini:
            - **Catatan Pinggir (Post-it Memo)** pada setiap halaman materi belajar.
            - **Efek Suara Manga (SFX)** interaktif saat murid menyelesaikan tugas harian.
            - **Terjemahan Langsung Google** yang akurat untuk Master & Murid.
            - **Ejaan Huruf Jepang (Kana & Kanji)** yang disesuaikan secara presisi.
            - **Sinkronisasi Real-Time & Kontrol Kuis Live**.
          files: |
            output_apk/Sari-Sensei-JLPT.apk
          prerelease: false
          generate_release_notes: false
