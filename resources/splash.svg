<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <defs>
    <linearGradient id="splashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <filter id="splashShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="2732" height="2732" fill="url(#splashBg)" />

  <!-- Decorative circles / Japanese motif -->
  <circle cx="1366" cy="1366" r="900" fill="none" stroke="#fef08a" stroke-width="16" stroke-opacity="0.15" />
  <circle cx="1366" cy="1366" r="700" fill="none" stroke="#fef08a" stroke-width="8" stroke-opacity="0.1" />

  <!-- Center Logo Mark -->
  <g transform="translate(1366, 1200)" filter="url(#splashShadow)">
    <circle cx="0" cy="0" r="260" fill="#f8fafc" />
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="280" fill="#fb7185" text-anchor="middle">先生</text>
  </g>

  <!-- App Title & Subtitle -->
  <text x="1366" y="1680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="110" fill="#f8fafc" text-anchor="middle" letter-spacing="4">サリ・センセイ</text>
  <text x="1366" y="1810" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="64" fill="#fef08a" text-anchor="middle" letter-spacing="2">SARI SENSEI JLPT N5-N2</text>

  <!-- Footer Tagline -->
  <text x="1366" y="2350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="40" fill="#cbd5e1" text-anchor="middle" opacity="0.8">Belajar Bahasa Jepang Interaktif • Manga Style • Catatan Pinggir</text>
</svg>
